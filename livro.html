<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Um livro pra você 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --rosa-claro: #ffe3ec;
    --rosa: #ff8fb1;
    --rosa-forte: #e0457b;
    --papel: #fff8f3;
    --vinho: #6b2140;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', system-ui, sans-serif;
    color: var(--vinho);
    background: radial-gradient(circle at 20% 15%, #fff 0, var(--rosa-claro) 45%, #ffc9da 100%);
    min-height: 100vh; padding: 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    overflow-x: hidden;
  }

  /* ---- Livro ---- */
  .livro {
    position: relative; z-index: 2;
    width: 100%; max-width: 440px; height: min(600px, 75vh);
    perspective: 1400px;
  }
  .capa-fundo {
    position: absolute; inset: -10px -10px -10px -18px;
    background: var(--rosa-forte);
    border-radius: 14px 26px 26px 14px;
    box-shadow: 0 20px 50px rgba(224, 69, 123, .35);
  }
  .pagina {
    position: absolute; inset: 0;
    background: var(--papel);
    background-image: repeating-linear-gradient(transparent 0 33px, rgba(255,143,177,.18) 33px 34px);
    border-radius: 6px 20px 20px 6px;
    padding: 34px 30px 60px 40px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    box-shadow: inset 12px 0 18px -12px rgba(107,33,64,.3);
    transform-origin: left center;
    transition: transform .35s ease-in, opacity .35s;
    overflow-y: auto;
  }
  .pagina.sair-frente { transform: rotateY(-80deg); opacity: 0; }
  .pagina.sair-tras  { transform: rotateY(80deg);  opacity: 0; }
  .pagina.entrar     { transition: none; }

  
  .pagina p { font-size: 1.1rem; line-height: 1.75; max-width: 34ch; }
  .pagina img {
    width: 100%; max-width: 220px; border-radius: 20px;
    border: 4px solid #fff; box-shadow: 0 6px 16px rgba(224,69,123,.25);
    margin-bottom: 16px;
  }
  .numero {
    position: absolute; bottom: 18px; left: 0; right: 0;
    font-size: .9rem; opacity: .6;
  }
  .final-link {
    margin-top: 20px; display: inline-block;
    background: var(--rosa-forte); color: #fff; text-decoration: none;
    padding: 12px 26px; border-radius: 999px; font-weight: 700;
    box-shadow: 0 5px 0 #a92c58;
  }

  /* ---- Controles ---- */
  .controles { display: flex; align-items: center; gap: 18px; z-index: 2; }
  .controles button {
    font: inherit; font-weight: 700; font-size: 1rem;
    background: var(--rosa-forte); color: #fff; border: 0;
    padding: 12px 24px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 5px 0 #a92c58;
    transition: transform .1s, box-shadow .1s;
  }
  .controles button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 #a92c58; }
  .controles button:disabled { opacity: .35; cursor: default; }
  .controles button:focus-visible { outline: 3px solid var(--vinho); outline-offset: 3px; }
  #contador { min-width: 60px; text-align: center; font-weight: 700; }

  /* ---- Corações ---- */
  .coracao {
    position: fixed; top: -40px; z-index: 1; pointer-events: none;
    animation: cair linear forwards;
  }
  @keyframes cair { to { transform: translateY(110vh) rotate(40deg); opacity: .4; } }
  @media (prefers-reduced-motion: reduce) {
    .coracao { display: none; }
    .pagina { transition: none; }
  }
</style>
</head>
<body>

  <div class="livro" id="livro">
    <div class="capa-fundo"></div>
    <div class="pagina" id="pagina" aria-live="polite"></div>
  </div>

  <div class="controles">
    <button id="voltar">← Voltar</button>
    <span id="contador"></span>
    <button id="avancar">Avançar →</button>
  </div>

<script>
  const paginas = [
    {
      titulo: "Um livro sobre você ",
      texto: "Escrevi cada página pensando em você. Vá virando devagarinho, tá?",
      imagem: ""
    },
    {
      titulo: "O seu sorriso",
      texto: "O teu sorriso vai além. Não é um mero traço, nem um gesto comum. Ele é como o sol — aquele mesmo que a vista procura e que eu gostaria de ter visto repetidas vezes, iluminando os meus dias sem pedir licença.",
      imagem: ""
    },
    {
      titulo: "O seu jeito",
      texto: "O seu jeito fica. Marca sem tentar, atrai sem pedir licença. É como o sol puxando a lua na órbita: não precisa abrir espaço, não faz esforço algum. Você apenas é — e isso basta para me puxar.",
      imagem: ""
    },
    {
      titulo: "Quando você se aproxima",
      texto: "Quando você se aproxima, o mundo ao redor se cala. O tempo esquece a pressa, congela em plena sala. Minha voz perde o caminho, o pensamento se desfaz; travo num silêncio manso pelo encanto que você traz. É como olhar a imensidão de um campo inteiro em flor, mas ver apenas uma rosa que rouba todo o esplendor.",
      imagem: ""
    },
    {
      titulo: "O que eu mais quero",
      texto: "Quero o caminho que me leva até você, dar cada passo sem recuar ou vacilar, mas quanto mais perto consigo me ver, mais me assusta a vontade de tocar. Há tanta doçura em tudo o que vejo, um traço tão manso no seu caminhar, que me sinto rústico frente à beleza dessa rosa única que me faz sonhar.",
      imagem: ""
    },
    {
      titulo: "💗",
      texto: "Você nunca saiu do meu pensamento, porque o que é seu não se perde no ar. Seu jeito tem a força do atemporal, um curso perfeito, constante e real, como a dança serena que a lua desenha ao redor do calor que o sol sabe dar. Cada sorriso que você me entregou, cada detalhe sincero no olhar, não foi lembrança passageira ao vento, nem traço que o tempo consiga apagar. Não ficaram apenas guardados na mente, nem presos às voltas da imaginação: eles desceram, firmes e vivos, e fincaram raiz no meu coração.",
      imagem: "",
    }
  ];

  let atual = 0, ocupado = false;
  const el = document.getElementById('pagina');
  const btnV = document.getElementById('voltar');
  const btnA = document.getElementById('avancar');
  const contador = document.getElementById('contador');

  function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function desenhar() {
    const p = paginas[atual];
    el.innerHTML =
      (p.imagem ? `<img src="${esc(p.imagem)}" alt="">` : '') +
      `<h2>${esc(p.titulo)}</h2><p>${esc(p.texto)}</p>` +
      (p.link ? `<a class="final-link" href="${esc(p.link.url)}">${esc(p.link.texto)}</a>` : '') +
      `<span class="numero">${atual + 1}</span>`;
    contador.textContent = `${atual + 1} / ${paginas.length}`;
    btnV.disabled = atual === 0;
    btnA.disabled = atual === paginas.length - 1;
  }

  function ir(delta) {
    const novo = atual + delta;
    if (ocupado || novo < 0 || novo >= paginas.length) return;
    ocupado = true;
    el.classList.add(delta > 0 ? 'sair-frente' : 'sair-tras');
    setTimeout(() => {
      atual = novo;
      desenhar();
      el.classList.add('entrar');
      el.classList.remove('sair-frente', 'sair-tras');
      void el.offsetWidth;            
      el.classList.remove('entrar');
      ocupado = false;
      if (delta > 0) chuva(6);
      if (atual === paginas.length - 1) chuva(30);
    }, 350);
  }

  btnA.onclick = () => ir(1);
  btnV.onclick = () => ir(-1);
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') ir(1);
    if (e.key === 'ArrowLeft') ir(-1);
  });

  // Deslizar no celular
  let x0 = null;
  document.getElementById('livro').addEventListener('touchstart', e => x0 = e.touches[0].clientX, { passive: true });
  document.getElementById('livro').addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 50) ir(dx < 0 ? 1 : -1);
    x0 = null;
  });

  // Corações
  const emojis = ['💗', '💖', '💕', '🌸', '💘'];
  function chuva(n) {
    for (let i = 0; i < n; i++) setTimeout(() => {
      const c = document.createElement('span');
      c.className = 'coracao';
      c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      c.style.left = Math.random() * 100 + 'vw';
      c.style.fontSize = (14 + Math.random() * 22) + 'px';
      c.style.animationDuration = (4 + Math.random() * 4) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 8500);
    }, i * 90);
  }

  desenhar();
  chuva(8);
</script>
</body>
</html>
